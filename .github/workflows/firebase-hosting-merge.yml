# Auto-generated by Firebase CLI and adapted for Flutter Web
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Create .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "GEMINI_API_KEY secret is missing or empty"
            exit 1
          fi
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > orcamente/.env

      - name: Validate Gemini API from production origin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent' \
            --header 'Content-Type: application/json' \
            --header "x-goog-api-key: $GEMINI_API_KEY" \
            --header 'Referer: https://app-orcamente.web.app/' \
            --data-raw '{"contents":[{"parts":[{"text":"Responda apenas OK."}]}]}')
          if [[ "$http_code" != "200" ]]; then
            echo "Gemini API validation failed with HTTP $http_code"
            cat "$response_file"
            rm -f "$response_file"
            exit 1
          fi
          echo "Gemini API validation passed"
          rm -f "$response_file"

      - name: Install dependencies
        run: flutter pub get
        working-directory: orcamente

      - name: Build web
        run: flutter build web --release
        working-directory: orcamente

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WINTER_DYNAMICS_410903 || secrets.FIREBASE_SERVICE_ACCOUNT_APP_ORCAMENTE || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: app-orcamente
          entryPoint: orcamente
