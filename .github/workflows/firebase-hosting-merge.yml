# Auto-generated by Firebase CLI and adapted for Flutter Web
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Create .env
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > orcamente/.env

      - name: Install dependencies
        run: flutter pub get
        working-directory: orcamente

      - name: Build web
        run: flutter build web --release
        working-directory: orcamente

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WINTER_DYNAMICS_410903 }}
          channelId: live
          projectId: app-orcamente
          entryPoint: orcamente
