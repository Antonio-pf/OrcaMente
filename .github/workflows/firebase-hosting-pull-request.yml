# Auto-generated by Firebase CLI and adapted for Flutter Web
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Create .env
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > orcamente/.env

      - name: Install dependencies
        run: flutter pub get
        working-directory: orcamente

      - name: Build web
        run: flutter build web --release
        working-directory: orcamente

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_ORCAMENTE || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: app-orcamente
          entryPoint: orcamente
